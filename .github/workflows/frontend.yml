name: frontend

# frontend 폴더가 바뀔 때만 돈다: main·dev 에 올라온 커밋과 PR. 린트와 빌드까지만 한다.
# 배포는 Cloudflare Pages 가 저장소를 직접 읽어서 한다(루트 폴더 frontend, 빌드 명령 npm run build, 결과 폴더 dist).
on:
  push:
    branches: [main, dev]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
