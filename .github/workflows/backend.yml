name: backend

# backend 폴더가 바뀔 때만 돈다: main·dev 에 올라온 커밋과 PR. 지금은 빌드와 테스트까지만 한다.
# 서버가 생기면 이 뒤에 "JAR 복사 → 서비스 재시작 → /actuator/health 확인" 단계를 붙인다(docs/리드미_배포_계획.md 3절).
on:
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # Windows 에서 커밋하면 실행 권한이 빠질 수 있다
      - run: chmod +x gradlew
      # 테스트가 Testcontainers 로 PostgreSQL 을 띄운다. GitHub 의 ubuntu 실행기에는 Docker 가 있다.
      - run: ./gradlew build
