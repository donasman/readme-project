<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>창 · 공고 고치기</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="readme-frame.css">
<link rel="stylesheet" href="readme-tabs.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div class="rm-root pal-a" data-theme="{{theme}}" style="position: relative; min-height: 100vh; background: var(--background); color: var(--foreground); font-family: var(--font-body); font-size: 16px; line-height: 1.4; letter-spacing: -0.01em; word-break: keep-all; text-wrap: pretty">
<div style="display: flex; min-height: 100vh; box-sizing: border-box; align-items: center; justify-content: center; padding: 24px 16px; background: oklch(0% 0 0 / .45)">
<div role="dialog" aria-modal="true" aria-labelledby="pe-title" style="display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 440px; box-sizing: border-box; padding: 24px; border: 1px solid var(--float-edge, var(--border-subtle)); border-radius: var(--radius-panel); background: var(--surface-raised); box-shadow: var(--shadow-floating)">

<div style="display: flex; flex-direction: column; gap: 8px">
<h2 id="pe-title" style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.4">공고 고치기</h2>
<p style="margin: 0; font-size: 14px; color: var(--text-secondary)">회사명, 공고명, 마감을 고칩니다. 원문 링크는 고칠 수 없습니다.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pe-company" style="font-size: 14px; font-weight: 500">회사명</label>
<input id="pe-company" type="text" maxLength="200" defaultValue="{{company}}" disabled="{{shared}}" style="height: var(--control-height-md); width: 100%; min-width: 0; box-sizing: border-box; padding: 4px 16px; border: 1px solid var(--border-strong); border-radius: var(--radius-pill); background: var(--input-fill); color: var(--foreground); font-family: inherit; font-size: 16px; letter-spacing: inherit; opacity: {{dim}}">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pe-name" style="font-size: 14px; font-weight: 500">공고명</label>
<input id="pe-name" type="text" maxLength="300" defaultValue="{{postName}}" disabled="{{shared}}" style="height: var(--control-height-md); width: 100%; min-width: 0; box-sizing: border-box; padding: 4px 16px; border: 1px solid var(--border-strong); border-radius: var(--radius-pill); background: var(--input-fill); color: var(--foreground); font-family: inherit; font-size: 16px; letter-spacing: inherit; opacity: {{dim}}">
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span id="pe-due-label" style="font-size: 14px; font-weight: 500">마감</span>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px">
<div role="group" aria-labelledby="pe-due-label" style="display: inline-flex; min-width: 0; max-width: 100%; border-radius: var(--radius-pill); background: var(--surface-muted)">
<div style="display: flex; min-width: 0; gap: 2px; padding: 3px; border-radius: var(--radius-pill)">
<sc-for list="{{dues}}" as="d" hint-placeholder-count="2">
<sc-if value="{{d.on}}"><button type="button" aria-pressed="true" disabled="{{shared}}" onClick="{{d.pick}}" style="flex: 0 0 auto; min-height: var(--control-height-sm); padding: 0 15px; border: 1px solid var(--border); border-radius: var(--radius-pill); background: var(--surface); box-shadow: var(--shadow-resting); color: var(--foreground); font-size: 14px; font-family: inherit; font-weight: 700; letter-spacing: inherit; white-space: nowrap; cursor: pointer">{{d.label}}</button></sc-if>
<sc-if value="{{d.off}}"><button type="button" aria-pressed="false" disabled="{{shared}}" onClick="{{d.pick}}" style="flex: 0 0 auto; min-height: var(--control-height-sm); padding: 0 16px; border: 0; border-radius: var(--radius-pill); background: transparent; color: var(--text-muted); font-size: 14px; font-family: inherit; font-weight: 700; letter-spacing: inherit; white-space: nowrap; cursor: pointer">{{d.label}}</button></sc-if>
</sc-for>
</div>
</div>
<sc-if value="{{dueDate}}" hint-placeholder-val="{{ true }}">
<label for="pe-due" class="rm-sr">마감일</label>
<input id="pe-due" type="date" defaultValue="{{dateValue}}" disabled="{{shared}}" style="height: var(--control-height-md); width: 100%; min-width: 0; box-sizing: border-box; padding: 4px 16px; border: 1px solid var(--border-strong); border-radius: var(--radius-pill); background: var(--input-fill); color: var(--foreground); font-family: inherit; font-size: 16px; letter-spacing: inherit; flex: 1 1 180px; max-width: 220px; opacity: {{dim}}">
</sc-if>
</div>
<sc-if value="{{wasUnknown}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 13px; color: var(--text-secondary)">마감일을 아직 모르는 공고입니다. 날짜나 상시로 저장하면 다시 "모름"으로 돌릴 수 없습니다.</p>
</sc-if>
</div>

<sc-if value="{{editable}}" hint-placeholder-val="{{ true }}">
<p style="margin: 0; font-size: 13px; color: var(--text-secondary)">고친 값은 이 공고를 보는 멤버 모두에게 보입니다. 내가 다른 그룹에도 올린 공고면 그 그룹에도 보입니다.</p>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px"><a href="GroupPost-Poster.dc.html" style="display: inline-flex; flex: none; align-items: center; justify-content: center; gap: 8px; height: var(--control-height-md); box-sizing: border-box; padding: 0 20px; border-radius: var(--radius-pill); font-size: 14px; border: 1px solid var(--outline-border); background: var(--outline-fill); color: var(--foreground); font-weight: 700; white-space: nowrap; text-decoration: none">취소</a><a href="GroupPost-Poster.dc.html" style="display: inline-flex; flex: none; align-items: center; justify-content: center; gap: 8px; height: var(--control-height-md); box-sizing: border-box; padding: 0 20px; border-radius: var(--radius-pill); font-size: 14px; border: 1px solid transparent; background: var(--accent); color: var(--accent-foreground); font-weight: 700; white-space: nowrap; text-decoration: none">저장</a></div>
</sc-if>

<sc-if value="{{shared}}" hint-placeholder-val="{{ false }}">
<div role="alert" style="display: flex; flex-direction: column; gap: 8px; padding: 16px 20px; border-radius: var(--radius-control); background: var(--highlight-subtle); font-size: 14px">
<strong style="font-weight: 700">고칠 수 없는 공고입니다</strong>
<span>다른 사람이 다른 그룹에도 올린 공고라 고칠 수 없습니다. 회사명, 공고명, 마감은 이 공고를 올린 그룹들이 함께 보는 값입니다.</span>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px"><a href="GroupPost-Poster.dc.html" style="display: inline-flex; flex: none; align-items: center; justify-content: center; gap: 8px; height: var(--control-height-md); box-sizing: border-box; padding: 0 20px; border-radius: var(--radius-pill); font-size: 14px; border: 1px solid var(--outline-border); background: var(--outline-fill); color: var(--foreground); font-weight: 700; white-space: nowrap; text-decoration: none">닫기</a></div>
</sc-if>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"deadline":{"editor":"enum","options":["date","unknown"],"default":"date"},"shared":{"editor":"boolean","default":false},"$preview":{"width":560,"height":660}}'>
class Component extends DCLogic {
renderVals() {
var props = this.props || {};
var st = this.state || {};
var self = this;
var theme = props.dark ? 'dark' : 'light';
var wasUnknown = props.deadline === 'unknown';
var shared = !!props.shared;
var due = st.due || (wasUnknown ? 'UNKNOWN' : 'DATE');
var kinds = [['DATE', '날짜'], ['ALWAYS', '상시']];
if (wasUnknown) kinds.push(['UNKNOWN', '모름']);
var dues = kinds.map(function (d) {
var on = d[0] === due;
return { label: d[1], on: on, off: !on, pick: function () { self.setState({ due: d[0] }); } };
});
return {
theme: theme,
company: wasUnknown ? '예시 에듀테크' : '예시 커머스',
postName: wasUnknown ? '백엔드 엔지니어' : '백엔드 개발자 신입',
dateValue: wasUnknown ? '' : '2026-11-16',
dues: dues,
dueDate: due === 'DATE',
wasUnknown: wasUnknown,
shared: shared,
editable: !shared,
dim: shared ? '.55' : '1'
};
}
}
</script>
</body>
</html>
