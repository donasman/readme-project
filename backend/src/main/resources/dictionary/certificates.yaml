# 자격증 사전 — jobfit은 이 파일을 읽지 않는다.
# 리드미에서 지원서 정보(자격증 칸)와 공고의 자격증 요건을 맞출 때 쓴다.
#
# 키워드 사전(keywords.txt)에 넣지 않은 이유
# - 자격증은 경험 카드가 아니라 지원서 정보에 있는 값이다.
# - 키워드로 넣으면 '정보처리기사 자격증 우대' 같은 항목이 "카드로 판단할 수 없는 조건"에서
#   "카드가 충족하지 못한 조건"으로 바뀌어 매칭 점수가 내려간다(jobfit 테스트 1건이 이 동작을 고정하고 있다).
#
# 형식 — 대표 표기: {다른 표기: [...], 관련 역량: [keywords.txt 의 대표 표기]}

정보처리기사: {다른 표기: [], 관련 역량: []}
정보처리산업기사: {다른 표기: [], 관련 역량: []}
정보보안기사: {다른 표기: [], 관련 역량: [정보보안]}
정보통신기사: {다른 표기: [], 관련 역량: [네트워크]}
네트워크관리사: {다른 표기: [], 관련 역량: [네트워크]}
리눅스마스터: {다른 표기: [리눅스 마스터], 관련 역량: [Linux]}
빅데이터분석기사: {다른 표기: [], 관련 역량: [데이터 분석]}
SQLD: {다른 표기: [], 관련 역량: [SQL]}
SQLP: {다른 표기: [], 관련 역량: [SQL]}
ADsP: {다른 표기: [], 관련 역량: [데이터 분석]}
컴퓨터활용능력: {다른 표기: [컴활], 관련 역량: []}
