# 운영 서버. 값은 모두 환경 변수로 받는다(backend/.env.example 참고). 빠진 값이 있으면 서버가 뜨지 않는다.
spring:
  datasource:
    url: ${DB_URL}           # 예: jdbc:postgresql://<Supabase 세션 모드 풀러 주소>:5432/postgres?currentSchema=readme
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # 구글 로그인(로그인 설계 6.1). 이 값이 있어야 SecurityConfig 가 oauth2Login 을 켠다.
  # 구글 클라이언트에 등록할 돌아올 주소: https://api.도메인/login/oauth2/code/google
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile

server:
  # Cloudflare 와 Caddy 뒤에 있으므로 X-Forwarded-* 헤더를 믿는다.
  # 그래서 구글 로그인의 돌아올 주소({baseUrl}/login/oauth2/code/google)가 http:// 가 아니라 https://api.도메인 으로 만들어진다.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true

app:
  frontend-origin: ${FRONTEND_ORIGIN}           # 예: https://app.도메인
  csrf-cookie-domain: ${CSRF_COOKIE_DOMAIN}     # 예: 도메인 (app. 과 api. 의 상위 도메인)
  mail-from: ${MAIL_FROM}                       # 예: 리드미 <no-reply@도메인>. 메일 발송 서비스에서 인증한 주소
  posting-read:
    contact: ${FETCHER_CONTACT}                 # 공고 링크를 받을 때 User-Agent 에 붙는 연락처. 공개 페이지나 mailto: 주소(로그인 화면이면 안 된다)
