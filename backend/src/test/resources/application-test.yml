# 통합 테스트(@IntegrationTest)가 쓰는 설정. dev 프로필의 설정(내 PC 의 DB, 메일 수신기, 예시 데이터)은 읽지 않는다.
# DB 는 Testcontainers 가 정한다(TestcontainersConfiguration). 메일은 보내지 않고 TestMailbox 에 모은다.
app:
  frontend-origin: http://localhost:5173
  csrf-cookie-domain:
  mail-from: 리드미 <no-reply@readme.test>
  posting-read:
    allow-loopback-for-tests: true   # 테스트가 띄운 내 PC 의 사이트(127.0.0.1)를 읽게 한다. 운영·개발 설정에는 넣지 않는다
    host-interval: 0s                # 테스트끼리 같은 127.0.0.1 을 읽으므로 기다리지 않는다. 간격은 HostThrottleTests 가 본다
    read-timeout: 2s                 # 시간 초과 테스트가 10초를 기다리지 않게
