<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 탭 아이콘: shared/components/logo-mark.tsx의 마크를 라이트 테마 색으로 굳힌 것 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>리드미</title>
    <!-- 링크를 메신저에 붙였을 때의 미리보기(초대 링크 등). 화면마다 바뀌는 탭 제목은 각 화면이 정한다 -->
    <meta name="description" content="취업준비생을 위한 정보공유·스터디. 그룹에서 공고를 같이 모으고, 내 경험은 카드로 정리해 공고에 맞춰 봅니다." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="리드미" />
    <meta property="og:title" content="리드미: 취업준비생을 위한 정보공유·스터디" />
    <meta property="og:description" content="그룹에서 공고를 같이 모으고, 내 경험은 카드로 정리해 공고에 맞춰 봅니다." />
    <meta property="og:locale" content="ko_KR" />
    <!-- 미리보기 이미지는 npm run shots가 /dev/og를 찍어 만든다.
         shortcut: 상대 주소라 카카오톡·페이스북 등은 읽지 못한다, 도메인이 정해지면 https://<도메인>/og.png 로 바꾼다 -->
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="리드미: 취업준비생을 위한 정보공유·스터디. 그룹 공고 목록 화면" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1e305e" />
    <script>
      // 첫 화면을 그리기 전에 <html>에 light/dark를 붙인다. ThemeProvider와 같은 저장 키("theme")를 읽는다.
      // 표시가 없으면 Arc 변수는 OS 설정을 따르지만 shadcn의 dark: 변형은 꺼진 채라 두 쪽이 어긋난다.
      ;(function () {
        var theme = null
        try {
          theme = localStorage.getItem("theme")
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
